project = DensityShear
ParticlePopulations = proton

dynamic_timestep = 1

[io]
diagnostic_write_interval = 100
write_initial_state = 0

system_write_t_interval = 1
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -1e6
vx_max = +1e6
vy_min = -1e6
vy_max = +1e6
vz_min = -1e6
vz_max = +1e6
vx_length = 50
vy_length = 50
vz_length = 50

[proton_sparse]
minValue = 1.0e-15

[gridbuilder]
x_length = 128
y_length = 128
z_length = 1
x_min = -64e5
x_max = 64e5
y_min = -64e5
y_max = 64e5
z_min = -50e3
z_max = 50e3
t_max = 500.0
dt = 0.1

[bailout]
min_dt = 5e-2
velocity_space_wall_block_margin = 1

[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_e_vol
output = vg_b_vol
output = vg_pressure

diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 50

[fieldsolver]
ohmHallTerm = 2
minCFL = 0.2
maxCFL = 0.25
maxSubcycles = 40
ohmGradPeTerm = 1

[vlasovsolver]
minCFL = 0.4
maxCFL = 0.49
maxSlAccelerationRotation = 10
maxSlAccelerationSubcycles = 10

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = yes

[DensityShear]

B0 = 1e-8
n0 = 1e6
T0 = 1e-15
verbose = 1
a = 1000e3